name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest -q tests --junitxml=test-results/backend.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/*.xml
          if-no-files-found: warn

  frontend:
    name: Frontend lint and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build production assets
        run: npm run build

  postgres:
    name: PostgreSQL 16 migrations and API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haushaltsradar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: haushaltsradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushaltsradar -d haushaltsradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: haushaltsradar
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: haushaltsradar_test
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      SEED_SAMPLE_DATA: "false"
      RUN_POSTGRES_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Migrate a fresh database
        run: python -m alembic upgrade head
      - name: Verify migrations can be repeated
        run: python -m alembic upgrade head
      - name: Test migrated database and application startup
        run: python -m pytest -q integration_tests --junitxml=test-results/postgres.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: backend/test-results/*.xml
          if-no-files-found: warn
