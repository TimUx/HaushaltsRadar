name: Release GHCR images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image-Tag (z. B. v1.0.0). Zusätzlich wird latest gesetzt, wenn kein Prerelease-Tag."
        required: true
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image_suffix: haushaltsradar-backend
          - name: frontend
            context: ./frontend
            image_suffix: haushaltsradar-frontend
            build_args: VITE_API_BASE_URL=/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Resolve version tags
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            RAW="${{ inputs.tag }}"
            PRERELEASE=false
            case "$RAW" in
              *-*) PRERELEASE=true ;;
            esac
          fi
          VERSION="${RAW#v}"
          echo "raw=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          # major.minor for 1.2.3 → 1.2
          if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([.-].*)?$'; then
            MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
            echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          else
            echo "major_minor=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.raw }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=HaushaltsRadar ${{ matrix.name }}
            org.opencontainers.image.description=HaushaltsRadar ${{ matrix.name }} image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ matrix.build_args || '' }}
