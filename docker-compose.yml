# Standard deployment with prebuilt GHCR images.
# Usage:
#   cp .env.example .env
#   export HAUSHALTSRADAR_VERSION=1.1.2   # or latest
#   docker compose up -d
#
# Optional local images:
#   export HAUSHALTSRADAR_BACKEND_IMAGE=haushaltsradar-backend
#   export HAUSHALTSRADAR_FRONTEND_IMAGE=haushaltsradar-frontend
#   export HAUSHALTSRADAR_VERSION=local
#
# Local development with live reload: docker compose -f docker-compose.dev.yml up --build

name: haushaltsradar

services:
  postgresql:
    image: postgres:16-alpine
    container_name: haushaltsradar-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haushaltsradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haushaltsradar}
      POSTGRES_DB: ${POSTGRES_DB:-haushaltsradar}
    volumes:
      - haushaltsradar_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haushaltsradar} -d ${POSTGRES_DB:-haushaltsradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${HAUSHALTSRADAR_BACKEND_IMAGE:-ghcr.io/timux/haushaltsradar-backend}:${HAUSHALTSRADAR_VERSION:-latest}
    container_name: haushaltsradar-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3080}
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    image: ${HAUSHALTSRADAR_FRONTEND_IMAGE:-ghcr.io/timux/haushaltsradar-frontend}:${HAUSHALTSRADAR_VERSION:-latest}
    container_name: haushaltsradar-frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  haushaltsradar_pgdata:
    name: haushaltsradar_pgdata
