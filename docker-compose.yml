services:
  postgresql:
    image: postgres:16-alpine
    container_name: kostenpilot-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kostenpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kostenpilot}
      POSTGRES_DB: ${POSTGRES_DB:-kostenpilot}
    volumes:
      - kostenpilot_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kostenpilot} -d ${POSTGRES_DB:-kostenpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kostenpilot-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: kostenpilot-frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  kostenpilot_pgdata:
