name: haushaltsradar-dev

services:
  postgresql:
    image: postgres:16-alpine
    container_name: haushaltsradar-postgresql
    environment:
      POSTGRES_USER: haushaltsradar
      POSTGRES_PASSWORD: haushaltsradar
      POSTGRES_DB: haushaltsradar
    ports:
      - "5432:5432"
    volumes:
      - haushaltsradar_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haushaltsradar -d haushaltsradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: haushaltsradar-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_USER: haushaltsradar
      POSTGRES_PASSWORD: haushaltsradar
      POSTGRES_DB: haushaltsradar
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      SECRET_KEY: dev-secret-key-change-me
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:3080
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: haushaltsradar-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  haushaltsradar_pgdata_dev:
  frontend_node_modules:
