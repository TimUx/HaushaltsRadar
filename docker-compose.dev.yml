services:
  postgresql:
    image: postgres:16-alpine
    container_name: kostenpilot-postgresql
    environment:
      POSTGRES_USER: kostenpilot
      POSTGRES_PASSWORD: kostenpilot
      POSTGRES_DB: kostenpilot
    ports:
      - "5432:5432"
    volumes:
      - kostenpilot_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kostenpilot -d kostenpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kostenpilot-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_USER: kostenpilot
      POSTGRES_PASSWORD: kostenpilot
      POSTGRES_DB: kostenpilot
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      SECRET_KEY: dev-secret-key-change-me
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: kostenpilot-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  kostenpilot_pgdata_dev:
  frontend_node_modules:
