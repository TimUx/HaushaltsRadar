# Prebuilt images from GHCR (kein lokaler Build von Frontend/Backend).
# Nutzung:
#   export HAUSHALTSRADAR_VERSION=1.0.0   # ohne führendes v, oder: latest
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Images:
#   ghcr.io/timux/haushaltsradar-backend
#   ghcr.io/timux/haushaltsradar-frontend
#
# Falls die Packages noch privat sind: einmalig bei GitHub unter
# Packages → Package → Package settings → Change visibility → Public.
#
# Frühere Images hießen ghcr.io/timux/kostenpilot-*; neue Releases nutzen haushaltsradar-*.

name: haushaltsradar

services:
  postgresql:
    image: postgres:16-alpine
    container_name: haushaltsradar-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haushaltsradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haushaltsradar}
      POSTGRES_DB: ${POSTGRES_DB:-haushaltsradar}
    volumes:
      - kostenpilot_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haushaltsradar} -d ${POSTGRES_DB:-haushaltsradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/timux/haushaltsradar-backend:${HAUSHALTSRADAR_VERSION:-latest}
    container_name: haushaltsradar-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3080}
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    image: ghcr.io/timux/haushaltsradar-frontend:${HAUSHALTSRADAR_VERSION:-latest}
    container_name: haushaltsradar-frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  # Legacy logical key + fixed Docker volume name from KostenPilot (preserves existing data)
  kostenpilot_pgdata:
    name: kostenpilot_kostenpilot_pgdata
