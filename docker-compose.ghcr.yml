# Prebuilt images from GHCR (kein lokaler Build von Frontend/Backend).
# Nutzung:
#   export KOSTENPILOT_VERSION=1.0.0   # ohne führendes v, oder: latest
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Images:
#   ghcr.io/timux/kostenpilot-backend
#   ghcr.io/timux/kostenpilot-frontend
#
# Falls die Packages noch privat sind: einmalig bei GitHub unter
# Packages → Package → Package settings → Change visibility → Public.

services:
  postgresql:
    image: postgres:16-alpine
    container_name: kostenpilot-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kostenpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kostenpilot}
      POSTGRES_DB: ${POSTGRES_DB:-kostenpilot}
    volumes:
      - kostenpilot_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kostenpilot} -d ${POSTGRES_DB:-kostenpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/timux/kostenpilot-backend:${KOSTENPILOT_VERSION:-latest}
    container_name: kostenpilot-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3080}
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy

  frontend:
    image: ghcr.io/timux/kostenpilot-frontend:${KOSTENPILOT_VERSION:-latest}
    container_name: kostenpilot-frontend
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  kostenpilot_pgdata:
